[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "media-catalog-python"
version = "2.0.0"
description = "Python services for movie, series, and catalog data with an HTTP gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13,<3", "pytest>=8,<10"]
rabbitmq = ["pika>=1.3,<2"]

[project.scripts]
media-catalog = "media_catalog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["media_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = true
